<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite - Heitor Petra 12 Anos</title>
    
    <!-- Tailwind CSS para estruturação rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Lilita One (estilo cartoon/jogo) e Nunito (leitura) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #121f3d; /* Azul profundo principal */
            background-image: radial-gradient(circle at top, #1e3366 0%, #0a1122 100%);
            min-height: 100vh;
            color: white;
            margin: 0;
            padding: 0;
        }

        .font-clash {
            font-family: 'Lilita One', cursive;
            letter-spacing: 1px;
        }

        .text-stroke {
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 3px 0 #000;
        }

        /* Estilo simulando placa de madeira */
        .wood-panel {
            background-color: #5c3a21;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.05) 10px,
                rgba(0,0,0,0.05) 20px
            );
            border: 4px solid #f9c733; /* Borda dourada */
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.6),
                0 8px 0 #3a2211,
                0 12px 20px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        /* Estilo simulando painel azul do jogo */
        .blue-panel {
            background-color: #1a4a8c;
            border: 4px solid #3c82d6;
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.4),
                0 6px 0 #0f2e59,
                0 10px 15px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        /* Botões com efeito 3D estilo jogo */
        .game-button {
            transition: all 0.1s ease;
            position: relative;
            top: 0;
            text-transform: uppercase;
            cursor: pointer;
        }

        .game-button:active {
            top: 4px;
            box-shadow: 0 0 0 transparent !important;
        }

        .btn-gold {
            background: linear-gradient(to bottom, #ffdf59, #f0a905);
            border: 3px solid #6b4105;
            box-shadow: 0 6px 0 #b37700;
            color: white;
            text-shadow: 1px 2px 0 #8c5a00;
        }

        .btn-green {
            background: linear-gradient(to bottom, #4ade80, #16a34a);
            border: 3px solid #064e3b;
            box-shadow: 0 6px 0 #14532d;
            color: white;
            text-shadow: 1px 2px 0 #064e3b;
        }

        /* Campos de input bonitos */
        .game-input {
            background-color: #f3f4f6;
            border: 3px solid #3c82d6;
            color: #1a4a8c;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .game-input:focus {
            outline: none;
            border-color: #f9c733;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2), 0 0 10px rgba(249, 199, 51, 0.5);
        }

        .info-row {
            background-color: #3a2211;
            border: 2px solid #85532c;
            border-radius: 8px;
            padding: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center">

    <main class="w-full max-w-lg flex flex-col gap-8">
        
        <!-- Banner da Festa -->
        <div class="relative w-full z-10 flex flex-col items-center">
            <!-- Imagem puxando da pasta local conforme solicitado -->
            <img 
                src="img/IMG-20260920-WA0029.jpg" 
                alt="Convite Heitor Petra 12 Anos" 
                class="w-full h-auto rounded-xl border-4 border-[#f9c733] shadow-2xl object-cover bg-gray-800"
                onerror="this.onerror=null; this.src='https://placehold.co/600x800/121f3d/f9c733?text=Imagem+N%C3%A3o+Encontrada\n(img/banner.jpg)';"
            >
        </div>

        <!-- Painel de Informações -->
        <section class="wood-panel p-6 z-10">
            <h1 class="font-clash text-3xl md:text-4xl text-[#f9c733] text-stroke text-center mb-6 leading-tight">
                Venha comemorar comigo!
            </h1>
            
            <div class="flex flex-col gap-4">
                <div class="info-row flex items-center">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] flex-shrink-0 text-black shadow-inner">
                        📅
                    </div>
                    <div class="ml-4">
                        <p class="text-[#f9c733] font-black text-xs uppercase tracking-wider mb-1">Quando?</p>
                        <p class="text-lg font-bold">24/10/2026</p>
                    </div>
                </div>

                <div class="info-row flex items-center">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] flex-shrink-0 text-black shadow-inner">
                        ⏰
                    </div>
                    <div class="ml-4">
                        <p class="text-[#f9c733] font-black text-xs uppercase tracking-wider mb-1">Horário</p>
                        <p class="text-lg font-bold">15h</p>
                    </div>
                </div>

                <div class="info-row flex items-center">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] flex-shrink-0 text-black shadow-inner">
                        📍
                    </div>
                    <div class="ml-4">
                        <p class="text-[#f9c733] font-black text-xs uppercase tracking-wider mb-1">Onde?</p>
                        <p class="text-sm font-bold leading-snug">Rua 24 de Maio, 99<br>Play, Rocha - Rio de Janeiro</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Painel da Lista de Convidados -->
        <section class="blue-panel p-6 z-10">
            <h2 class="font-clash text-2xl text-white text-center mb-2">Lista de Convidados</h2>
            <p class="text-blue-200 text-center text-sm font-semibold mb-6">Quem vai com você?</p>
            
            <!-- Container onde os inputs serão adicionados dinamicamente -->
            <div id="guest-list" class="flex flex-col gap-3 mb-6">
                <!-- Primeiro input (padrão) -->
                <div class="relative flex items-center gap-2 guest-row">
                    <span class="font-clash text-xl text-[#f9c733] w-6 row-number">1.</span>
                    <input type="text" placeholder="Seu nome" class="game-input w-full p-3 rounded-lg font-bold text-base guest-input">
                </div>
            </div>

            <button id="add-btn" class="game-button btn-gold w-full py-3 rounded-xl font-clash text-lg tracking-wide flex items-center justify-center gap-2">
                <span class="text-2xl drop-shadow-md">+</span> Adicionar mais nomes
            </button>
        </section>

        <!-- Ações Finais (Aviso de Erro e Botão WhatsApp) -->
        <section class="z-10 pb-12">
            <!-- Caixa de alerta de erro (oculta por padrão) -->
            <div id="error-box" class="hidden bg-red-600 text-white font-bold p-4 rounded-xl text-center border-2 border-red-800 shadow-lg mb-4 transition-all">
                ⚠️ Atenção: A lista está vazia. Escreva pelo menos um nome!
            </div>

            <button id="whatsapp-btn" class="game-button btn-green w-full py-4 rounded-xl font-clash text-2xl tracking-wide flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16" style="filter: drop-shadow(1px 2px 0px #064e3b);">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Confirmar pelo WhatsApp
            </button>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const guestList = document.getElementById('guest-list');
            const addBtn = document.getElementById('add-btn');
            const whatsappBtn = document.getElementById('whatsapp-btn');
            const errorBox = document.getElementById('error-box');

            // Função para esconder o aviso de erro (chamada quando o usuário digita algo)
            const hideError = () => {
                errorBox.classList.add('hidden');
            };

            // Listener para o input inicial
            guestList.querySelector('.guest-input').addEventListener('input', hideError);

            // Função para atualizar os números na lateral dos inputs (1., 2., 3...)
            const updateRowNumbers = () => {
                const rows = guestList.querySelectorAll('.guest-row');
                rows.forEach((row, index) => {
                    const numberSpan = row.querySelector('.row-number');
                    if(numberSpan) numberSpan.innerText = `${index + 1}.`;
                });
            };

            // Lógica para adicionar um novo campo de texto dinamicamente
            addBtn.addEventListener('click', () => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'relative flex items-center gap-2 mt-2 guest-row';
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'font-clash text-xl text-[#f9c733] w-6 text-right row-number';

                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `Nome do convidado`;
                input.className = 'game-input w-full p-3 rounded-lg font-bold text-base guest-input';
                input.addEventListener('input', hideError);

                // Botão de deletar linha (Melhora a UX)
                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '✖';
                removeBtn.title = "Remover nome";
                removeBtn.className = 'absolute right-3 text-red-500 font-bold hover:text-red-700 active:scale-90 transition-transform text-lg';
                removeBtn.onclick = () => {
                    rowDiv.remove();
                    updateRowNumbers();
                };

                rowDiv.appendChild(numberSpan);
                rowDiv.appendChild(input);
                rowDiv.appendChild(removeBtn);
                guestList.appendChild(rowDiv);
                
                updateRowNumbers();
                input.focus(); // Foca automaticamente no novo input criado
            });

            // Lógica para formatar a mensagem e redirecionar para o WhatsApp
            whatsappBtn.addEventListener('click', () => {
                const inputs = document.querySelectorAll('.guest-input');
                const validNames = [];

                // Pega apenas os campos que não estão vazios
                inputs.forEach(input => {
                    const name = input.value.trim();
                    if (name !== '') {
                        validNames.push(name);
                    }
                });

                // Validação de erro customizada na interface
                if (validNames.length === 0) {
                    errorBox.classList.remove('hidden');
                    // Rola a tela para o erro ficar visível
                    errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }

                // Montar o texto da mensagem
                let message = 'Olá, confirmando presença na festa do Heitor.\nLista:\n';
                validNames.forEach((name, index) => {
                    message += `${index + 1}. ${name}\n`;
                });

                // Enviar para o número e gerar link
                const phoneNumber = '5521994082850';
                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
                
                // Abre o aplicativo/site do WhatsApp
                window.open(whatsappUrl, '_blank');
            });
        });
    </script>
</body>
</html>
